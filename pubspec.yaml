name: grabitt
description: "GraBiTT - Food Delivery App"
publish_to: 'none'

version: 1.0.20+20
# version: 1.0.0+4
environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  carousel_slider: ^5.1.1
  intl: any
  provider: ^6.1.2
  percent_indicator: ^4.2.3
  change_app_package_name: ^1.5.0
  audioplayers: ^6.0.0
  http: ^1.2.0
  lottie: ^3.1.2
  geolocator: ^13.0.2
  shared_preferences: ^2.2.2
  sms_autofill: ^2.4.0
  permission_handler: ^11.3.0
  #readotp: ^1.0.2
  #package_info_plus: ^10.1.0
  package_info_plus: ^9.0.1
  razorpay_flutter:
  url_launcher: ^6.2.5
  google_fonts: ^8.1.0
  cached_network_image: ^3.4.1
  device_info_plus: ^12.4.0
  uuid: ^4.5.3
  flutter_launcher_icons: ^0.14.4
  flutter_local_notifications: ^22.0.0
  workmanager: ^0.9.0+3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    -  assets/images/
    -  assets/icons/
    -  assets/sounds/
    -  assets/animations/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/newlogo.png" 